<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1d"/>
      <stop offset="100%" style="stop-color:#1a0533"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="24" fill="url(#bg)"/>
  <rect width="600" height="200" rx="24" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>

  <!-- Ambient orbs -->
  <circle cx="500" cy="30" r="120" fill="rgba(99,102,241,0.08)"/>
  <circle cx="80" cy="170" r="80" fill="rgba(139,92,246,0.06)"/>

  <!-- Icon background -->
  <rect x="80" y="55" width="60" height="60" rx="16" fill="url(#iconGrad)"/>

  <!-- Star icon -->
  <text x="110" y="96" text-anchor="middle" font-size="32" fill="white" filter="url(#glow)">✦</text>

  <!-- Title -->
  <text x="160" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">AI Best Find</text>

  <!-- Subtitle -->
  <text x="160" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#818cf8" letter-spacing="4" text-transform="uppercase">CURATED AI TOOLS &amp; NEWS</text>
</svg>
