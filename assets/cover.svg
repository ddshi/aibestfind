<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="40%" style="stop-color:#1a0533"/>
      <stop offset="70%" style="stop-color:#0d1b3e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid texture -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <line x1="60" y1="0" x2="60" y2="60" stroke="rgba(99,102,241,0.03)" stroke-width="1"/>
    <line x1="0" y1="60" x2="60" y2="60" stroke="rgba(99,102,241,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Floating orbs -->
  <circle cx="1100" cy="30" r="280" fill="rgba(99,102,241,0.06)"/>
  <circle cx="200" cy="550" r="200" fill="rgba(139,92,246,0.04)"/>
  <circle cx="50" cy="200" r="150" fill="rgba(245,158,11,0.03)"/>
  <circle cx="900" cy="150" r="80" fill="rgba(99,102,241,0.05)"/>

  <!-- Logo area -->
  <rect x="525" y="100" width="44" height="44" rx="12" fill="url(#iconGrad)"/>
  <text x="547" y="131" text-anchor="middle" font-size="24" fill="white">✦</text>
  <text x="580" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="900" fill="url(#logoTextGrad)" letter-spacing="-0.3">AI Best Find</text>

  <!-- Badge -->
  <rect x="505" y="180" width="190" height="34" rx="17" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.15)" stroke-width="1"/>
  <text x="600" y="203" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#a5b4fc" font-weight="600">Discover. Evaluate. Choose.</text>

  <!-- Headline -->
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
    <tspan x="600" dy="0">Find AI Tools</tspan>
    <tspan x="600" dy="58">That Actually Work</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="rgba(156,163,175,0.8)">
    <tspan x="600" dy="0">In-depth reviews of AI tools + daily AI news digest.</tspan>
    <tspan x="600" dy="26">No hype. Just honest testing and real data.</tspan>
  </text>

  <!-- Feature pills -->
  <rect x="430" y="420" width="175" height="38" rx="10" fill="rgba(99,102,241,0.06)" stroke="rgba(99,102,241,0.12)" stroke-width="1"/>
  <text x="517" y="445" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#a5b4fc" font-weight="500">📰 Daily AI News</text>

  <rect x="615" y="420" width="160" height="38" rx="10" fill="rgba(99,102,241,0.06)" stroke="rgba(99,102,241,0.12)" stroke-width="1"/>
  <text x="695" y="445" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#a5b4fc" font-weight="500">🔍 Deep Reviews</text>

  <rect x="785" y="420" width="130" height="38" rx="10" fill="rgba(99,102,241,0.06)" stroke="rgba(99,102,241,0.12)" stroke-width="1"/>
  <text x="850" y="445" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#a5b4fc" font-weight="500">🆓 Free Tools</text>

  <!-- URL -->
  <text x="600" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="rgba(107,114,128,0.5)">aibestfind.com</text>
</svg>
