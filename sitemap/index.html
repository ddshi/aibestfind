<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Map — AI Best Find</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafbfc;color:#111827;line-height:1.7;max-width:820px;margin:0 auto;padding:48px 20px}
  h1{font-size:1.8em;font-weight:900;text-align:center;margin-bottom:8px}
  .subtitle{text-align:center;color:#9ca3af;font-size:.95em;margin-bottom:40px}
  .section{margin-bottom:36px}
  .section h2{font-size:1.2em;color:#4338ca;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #e5e7eb}
  .link-card{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;text-decoration:none;color:#111827;transition:.2s}
  .link-card:hover{border-color:rgba(99,102,241,.3);box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .link-card .icon{font-size:1.3em;min-width:28px;text-align:center}
  .link-card .info{flex:1;min-width:0}
  .link-card .title{font-weight:600;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-card .meta{font-size:.82em;color:#9ca3af;margin-top:2px}
  .link-card .arrow{color:#cbd5e1;font-size:.9em}
  .footer{text-align:center;margin-top:48px;padding-top:24px;border-top:1px solid #e5e7eb;color:#9ca3af;font-size:.85em}
  .footer a{color:#6366f1;text-decoration:none}
</style>
</head>
<body>
<h1>🗺️ Sitemap</h1>
<p class="subtitle">All pages on aibestfind.com — last updated: <span id="generated">loading...</span></p>

<div class="section">
  <h2>🏠 Home</h2>
  <a href="/" class="link-card">
    <span class="icon">🏠</span>
    <span class="info"><span class="title">AI Best Find — Homepage</span><span class="meta">Curated AI Tools & Daily AI News</span></span>
    <span class="arrow">→</span>
  </a>
</div>

<div class="section">
  <h2>📝 Reviews & Comparisons</h2>
  <div id="reviews">Loading...</div>
</div>

<div class="section">
  <h2>📰 AI News Digest</h2>
  <div id="news">Loading...</div>
</div>

<div class="footer">
  <p><a href="/">← Back to AI Best Find</a></p>
  <p style="margin-top:8px;font-size:.8em">XML version: <a href="/sitemap.xml">sitemap.xml</a> (for search engines)</p>
</div>

<script>
(async () => {
  try {
    const res = await fetch('/sitemap.xml');
    const xml = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, 'text/xml');

    const urls = [...doc.querySelectorAll('url')];
    
    // Generate date from newest news
    const newest = urls.find(u => u.querySelector('lastmod'));
    if (newest) {
      document.getElementById('generated').textContent = newest.querySelector('lastmod').textContent;
    } else {
      document.getElementById('generated').textContent = new Date().toISOString().slice(0,10);
    }

    const reviews = urls.filter(u => {
      const loc = u.querySelector('loc')?.textContent || '';
      return loc.includes('/posts/');
    });

    const news = urls.filter(u => {
      const loc = u.querySelector('loc')?.textContent || '';
      return loc.includes('/news/');
    });

    function renderList(items, containerId, prefix) {
      const container = document.getElementById(containerId);
      if (items.length === 0) {
        container.innerHTML = '<p style="color:#9ca3af;padding:12px">No pages yet.</p>';
        return;
      }
      container.innerHTML = items.map(u => {
        const loc = u.querySelector('loc')?.textContent || '';
        const date = u.querySelector('lastmod')?.textContent || '';
        const path = new URL(loc).pathname;
        let label = path.replace(/^\/posts\//, '').replace(/^\/news\//, '').replace(/\/$/, '').replace(/\.html$/, '');
        label = label.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const icon = prefix === 'posts' ? '📝' : '📰';
        return `<a href="${loc}" class="link-card">
          <span class="icon">${icon}</span>
          <span class="info"><span class="title">${label}</span><span class="meta">${date || ''}</span></span>
          <span class="arrow">→</span>
        </a>`;
      }).join('');
    }

    renderList(reviews, 'reviews', 'posts');
    renderList(news, 'news', 'news');
  } catch(e) {
    document.getElementById('reviews').innerHTML = '<p style="color:#dc2626">Failed to load sitemap data.</p>';
    document.getElementById('news').innerHTML = '';
  }
})();
</script>
</body>
</html>
