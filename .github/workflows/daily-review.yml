name: Daily AI Tool Review

on:
  schedule:
    # UTC 6:00 = 北京时间 14:00 (每天下午)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      tool_index:
        description: '手动指定工具索引 (0=最新, 留空=自动选择)'
        required: false
        default: ''

jobs:
  generate-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate AI tool review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node .github/scripts/generate-review.mjs

      - name: Update sitemap
        run: node .github/scripts/update-sitemap.mjs

      - name: Commit and push
        run: |
          git config user.name "AI Review Bot"
          git config user.email "bot@aibestfind.com"
          git add .
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: AI工具评测 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs origin main || true
            git push --force-with-lease || true
          fi
